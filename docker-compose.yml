services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: freewise
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      FREEWISE_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/freewise
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pg_data:
